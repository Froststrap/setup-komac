name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          version: "2.17.2"

      - name: Verify komac is on PATH
        shell: bash
        run: komac --version | grep -q "2.17.2"
